<!DOCTYPE html>
<html lang="en" data-native-video-viewer="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-oLIxyf61w26A/8P4jlH2C4oSLKMbxrbuYNyN5+1Diyw='; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Video</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>
<video id="player" controls autoplay playsinline preload="auto"></video>

<script>
"use strict";

(async () => {
    const player = document.getElementById("player");
    const unavailable = () => document.body.replaceChildren();
    try {
        const query = new URLSearchParams(location.search);
        if (location.protocol !== "https:" || [...query.keys()].length !== 2 ||
            query.getAll("id").length !== 1 || query.getAll("h").length !== 1 ||
            !/^[0-9]{1,20}$/.test(query.get("id") || "") ||
            !/^[a-f0-9]{64}$/.test(query.get("h") || "")) throw new Error("Invalid identity");
        const id = query.get("id"), hash = query.get("h");
        const abort = new AbortController(), timeout = setTimeout(() => abort.abort(), 8000);
        let manifest;
        try {
            const result = await fetch(new URL("./media-index.json", location.href), {
                redirect: "error", credentials: "omit", referrerPolicy: "no-referrer", cache: "no-store", signal: abort.signal
            });
            if (!result.ok || result.headers.get("content-type")?.split(";")[0].trim() !== "application/json")
                throw new Error("Manifest unavailable");
            const reader = result.body.getReader(), decoder = new TextDecoder("utf-8", {fatal: true});
            let size = 0, text = "";
            try {
                for (;;) {
                    const chunk = await reader.read();
                    if (chunk.done) break;
                    size += chunk.value.byteLength;
                    if (size > 1024 * 1024) {abort.abort(); throw new Error("Manifest too large");}
                    text += decoder.decode(chunk.value, {stream: true});
                }
                text += decoder.decode();
            } finally {reader.releaseLock();}
            manifest = JSON.parse(text);
        } finally {clearTimeout(timeout);}
        if (!manifest || manifest.version !== 1 || !manifest.items || Array.isArray(manifest.items) ||
            !Object.hasOwn(manifest.items, id)) throw new Error("Unknown identity");
        const item = manifest.items[id];
        if (!item || item.status !== "READY" || item.sha256 !== hash ||
            (item.path !== undefined && item.path !== "media/" + hash + ".mp4") || item.content_type !== "video/mp4" ||
            !Number.isSafeInteger(item.size_bytes) || item.size_bytes <= 0 ||
            !Number.isFinite(item.duration_seconds) || item.duration_seconds <= 0) throw new Error("Media unavailable");
        const mediaUrl = new URL("./media/" + hash + ".mp4", location.href);
        let redirected = false, fallbackTimer = null;
        const clearFallbackTimer = () => {
            if (fallbackTimer !== null) {clearTimeout(fallbackTimer); fallbackTimer = null;}
        };
        const openDirectly = async () => {
            if (redirected) return;
            redirected = true;
            clearFallbackTimer();
            const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 8000);
            try {
                const result = await fetch(mediaUrl, {
                    method: "HEAD", redirect: "error", credentials: "omit", referrerPolicy: "no-referrer",
                    cache: "no-store", signal: controller.signal
                });
                if (result.status !== 200 || result.redirected || result.url !== mediaUrl.href ||
                    result.headers.get("content-type")?.split(";")[0].trim() !== "video/mp4")
                    throw new Error("Direct media unavailable");
                window.location.replace(mediaUrl.href);
            } catch (_error) {unavailable();}
            finally {clearTimeout(timer);}
        };
        const source = document.createElement("source");
        source.src = mediaUrl.href;
        source.type = "video/mp4";
        source.addEventListener("error", openDirectly, {once: true});
        player.addEventListener("error", openDirectly, {once: true});
        player.addEventListener("canplay", clearFallbackTimer, {once: true});
        player.addEventListener("playing", clearFallbackTimer, {once: true});
        player.appendChild(source);
        fallbackTimer = setTimeout(openDirectly, 10000);
        player.load();
        player.play().catch(() => {
            // Browser autoplay policy leaves the same native controls available.
        });
    } catch (_error) {unavailable();}
})();
</script>
</body>
</html>
